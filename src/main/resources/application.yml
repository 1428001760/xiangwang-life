server:
  port: 8081
spring:
  application:
    name: xiangwang-life
  main:
    allow-circular-references: true  # 解决循环依赖报错
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:xiangwang}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:changeme}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:changeme}
      lettuce:
        pool:
          max-active: 10
          max-idle: 10
          min-idle: 1
          time-between-eviction-runs: 10s
  jackson:
    default-property-inclusion: non_null
  # RabbitMQ 配置：秒杀订单异步削峰
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 消息发送失败时返回给生产者（配合 publisher-returns 使用）
    publisher-returns: true
    publisher-confirm-type: correlated
    template:
      # 必须开启 mandatory，否则消息路由不到队列时会被静默丢弃
      mandatory: true
    listener:
      simple:
        # 手动 ACK：业务处理成功后才确认，失败重回队列
        acknowledge-mode: manual
        # 每次预取 1 条，避免单个消费者囤积消息
        prefetch: 1
        # 并发消费者数量（可水平扩展）
        concurrency: 1
        max-concurrency: 4
        # 消费者异常时不无限重试，交给业务代码控制重试次数
        default-requeue-rejected: false
mybatis-plus:
  type-aliases-package: com.xiangwang.entity
  configuration:
      map-underscore-to-camel-case: true # 开启下划线转驼峰，必加！
logging:
  level:
    com.xiangwang: debug
